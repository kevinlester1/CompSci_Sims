<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .square-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 1 / 1;
        }

        .square-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .modal-overlay {
            backdrop-filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>

                    { q: "Can a robot be reprogrammed to perform a completely different task?", options: ["No, they are single-use.", "Yes, programmability is a defining characteristic of a robot.", "Only if you rebuild the hardware.", "Only by the original manufacturer."], answer: 1 },
                    { q: "Which part of a robot acts as its 'brain'?", options: ["The Actuators", "The Sensors", "The Microprocessor or Microcontroller", "The Power Supply"], answer: 2 },
                    { q: "What gives a robot the ability to interact with and move objects in the physical world?", options: ["Cameras", "Microphones", "Actuators (such as motors, hydraulics, or pneumatics).", "Wi-Fi antennas"], answer: 2 }
                ]
            },
            {
                id: "6.2.3", unit: "Unit 6", unitName: "Automated and emerging technologies", statement: "Roles of robots",
                questions: [
                    { q: "Which is a common role for robots in a domestic setting?", options: ["Performing open-heart surgery.", "Assembling cars.", "Vacuuming floors.", "Managing cloud servers."], answer: 2 },
                    { q: "Which role is highly suited for industrial robots?", options: ["Walking a dog.", "Repetitive heavy lifting and precise welding on car assembly lines.", "Writing a novel.", "Teaching a class."], answer: 1 },
                    { q: "How are robots increasingly used in the medical field?", options: ["To prescribe medicine.", "Assisting surgeons with minimally invasive procedures that require extreme precision.", "To build hospitals.", "To answer phones."], answer: 1 },
                    { q: "Why are robots used for bomb disposal and space exploration?", options: ["Because they are cheap to replace.", "Because those environments are too dangerous or hostile for human beings.", "Because they work faster.", "Because they don't need oxygen."], answer: 1 },
                    { q: "Which of the following is an example of an agricultural robot?", options: ["A robot vacuum.", "An automated drone that maps crops and sprays pesticides precisely.", "A robotic arm building a computer.", "A chatbot."], answer: 1 }
                ]
            },
            {
                id: "6.3.1", unit: "Unit 6", unitName: "Automated and emerging technologies", statement: "Meaning of AI",
                questions: [
                    { q: "What is Artificial Intelligence (AI)?", options: ["A branch of computer science dealing with the simulation of intelligent behaviours by computers.", "A type of physical robot.", "A secure method of transmitting data over HTTPS.", "A hardware component in the CPU."], answer: 0 },
                    { q: "What is the ultimate goal of Artificial Intelligence research?", options: ["To create faster Wi-Fi.", "To create machines capable of human-like intelligence, reasoning, and problem-solving.", "To build a better mechanical arm.", "To replace all hard drives."], answer: 1 },
                    { q: "What distinguishes AI from standard programming?", options: ["AI uses electricity.", "Standard programming relies on strict rules; AI can find patterns, learn, and adapt without explicit instructions.", "AI only works on the cloud.", "There is no difference."], answer: 1 },
                    { q: "Which subset of AI involves training a system on large amounts of data so it can make predictions?", options: ["Robotics", "Machine Learning", "Expert Systems", "Natural Language Processing"], answer: 1 },
                    { q: "Which test was famously proposed to determine if a machine exhibits human-equivalent intelligence?", options: ["The Von Neumann Test", "The Turing Test", "The Boolean Test", "The Lovelace Test"], answer: 1 }
                ]
            },
            {
                id: "6.3.2", unit: "Unit 6", unitName: "Automated and emerging technologies", statement: "Characteristics of AI",
                questions: [
                    { q: "What is a main characteristic of AI?", options: ["It requires a physical actuator to function.", "It relies solely on brute-force algorithms.", "The collection of data and rules, reasoning, and the ability to learn and adapt.", "It cannot process text or sound data."], answer: 2 },
                    { q: "How does a machine learning algorithm improve over time?", options: ["By being rebooted.", "By processing more training data and adjusting its internal weightings/patterns.", "By increasing the clock speed.", "By downloading more RAM."], answer: 1 },
                    { q: "What is 'narrow AI' (or weak AI)?", options: ["AI that is not very smart.", "AI designed and trained for one specific task, like playing chess or recognizing faces.", "AI that mimics a human perfectly.", "AI that runs on a smartphone."], answer: 1 },
                    { q: "Which of the following is an everyday example of AI?", options: ["A mechanical clock.", "A streaming service recommending movies based on your viewing history.", "A basic calculator.", "A wired mouse."], answer: 1 },
                    { q: "What is Natural Language Processing (NLP) in the context of AI?", options: ["Translating binary to hex.", "The ability of a computer program to understand human language as it is spoken or written.", "Writing HTML code automatically.", "Typing very fast."], answer: 1 }
                ]
            },
            {
                id: "6.3.3", unit: "Unit 6", unitName: "Automated and emerging technologies", statement: "AI systems operation",
                questions: [
                    { q: "An expert system is an example of AI. Identify three components present in an expert system. (Source: questions.pdf)", options: ["Mouse, keyboard, monitor", "Knowledge base, rule base, inference engine", "RAM, ROM, CPU", "Router, switch, hub"], answer: 1 },
                    { q: "In an expert system, what is the role of the Inference Engine?", options: ["To store data.", "It applies logical rules to the knowledge base to deduce new information or make a decision.", "To interact with the user.", "To translate languages."], answer: 1 },
                    { q: "How does a user interact with an expert system (e.g., to input symptoms)?", options: ["Through the Inference Engine", "Through the Knowledge Base", "Through the User Interface", "Through the Rule Base"], answer: 2 },
                    { q: "What is the 'Rule Base' in an expert system?", options: ["A list of passwords.", "A set of IF-THEN rules used by the inference engine to navigate the knowledge base.", "The terms and conditions of use.", "The source code of the system."], answer: 1 },
                    { q: "Who inputs the initial facts and rules into an expert system?", options: ["The end user.", "Human domain experts and knowledge engineers.", "The inference engine.", "It learns them automatically from the internet."], answer: 1 }
                ]
            }
        ];

        // State management
        let completedItems = JSON.parse(localStorage.getItem('syllabusTrackerState')) || [];
        let incorrectItems = JSON.parse(localStorage.getItem('syllabusTrackerIncorrect')) || [];
        let currentItem = null;
        let currentQuestion = null;

        const gridContainer = document.getElementById('syllabus-grid');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        // Modal elements
        const modal = document.getElementById('quiz-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalUnitBadge = document.getElementById('modal-unit-badge');
        const modalQuestion = document.getElementById('modal-question');
        const optionsContainer = document.getElementById('options-container');
        const modalFeedback = document.getElementById('modal-feedback');

        function initApp() {
            renderGrid();
            updateProgress();
        }

        function renderGrid() {
            gridContainer.innerHTML = '';
            
            syllabusData.forEach((item, index) => {
                const isCompleted = completedItems.includes(item.id);
                const isIncorrect = incorrectItems.includes(item.id) && !isCompleted;
                
                // Color coding based on unit for a nice visual gradient if not completed
                const unitColors = {
                    "Unit 1": "bg-blue-50 text-blue-900 border-blue-200 hover:border-blue-400 hover:shadow-blue-100",
                    "Unit 2": "bg-indigo-50 text-indigo-900 border-indigo-200 hover:border-indigo-400 hover:shadow-indigo-100",
                    "Unit 3": "bg-violet-50 text-violet-900 border-violet-200 hover:border-violet-400 hover:shadow-violet-100",
                    "Unit 4": "bg-purple-50 text-purple-900 border-purple-200 hover:border-purple-400 hover:shadow-purple-100",
                    "Unit 5": "bg-fuchsia-50 text-fuchsia-900 border-fuchsia-200 hover:border-fuchsia-400 hover:shadow-fuchsia-100",
                    "Unit 6": "bg-pink-50 text-pink-900 border-pink-200 hover:border-pink-400 hover:shadow-pink-100",
                };

                const baseStyles = "square-card cursor-pointer rounded-2xl p-4 md:p-5 flex flex-col justify-between border-2 relative overflow-hidden group";
                
                let appliedStyles = "";
                let iconHtml = "";

                if (isCompleted) {
                    appliedStyles = "bg-gradient-to-br from-emerald-400 to-green-500 border-green-500 shadow-green-200/50 text-white shadow-lg";
                    iconHtml = `
                        <div class="absolute -bottom-2 -right-2 text-white/20 w-16 h-16 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    `;
                } else if (isIncorrect) {
                    appliedStyles = "bg-red-50 text-red-900 border-red-300 hover:border-red-500 shadow-sm";
                    iconHtml = `
                        <div class="absolute -bottom-2 -right-2 text-red-500/10 w-16 h-16 group-hover:scale-110 transition-transform">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm-1.72 6.97a.75.75 0 10-1.06 1.06L10.94 12l-1.72 1.72a.75.75 0 101.06 1.06L12 13.06l1.72 1.72a.75.75 0 101.06-1.06L13.06 12l1.72-1.72a.75.75 0 10-1.06-1.06L12 10.94l-1.72-1.72z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    `;
                } else {
                    appliedStyles = unitColors[item.unit] || "bg-white text-slate-800 border-slate-200 hover:border-slate-300";
                }

                const cardHtml = `
                    <div id="card-${item.id}" class="${baseStyles} ${appliedStyles}" onclick="handleSquareClick('${item.id}')">
                        <div>
                            <span class="text-xs font-bold uppercase tracking-wider opacity-80">${item.id}</span>
                            <h3 class="font-bold text-sm md:text-base mt-1 leading-tight">${item.statement}</h3>
                        </div>
                        <div class="mt-4 text-xs font-medium opacity-75">
                            ${item.unit}
                        </div>
                        ${iconHtml}
                    </div>
                `;
                
                gridContainer.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function updateProgress() {
            const total = syllabusData.length;
            const completed = completedItems.length;
            const percentage = (completed / total) * 100;
            
            progressBar.style.width = `${percentage}%`;
            progressText.innerText = `${completed} / ${total}`;
            
            // Calculate and update unit-specific progress
            const unitStats = {};
            // Initialize stats for Units 1 to 6
            for(let i = 1; i <= 6; i++) {
                unitStats[`Unit ${i}`] = { total: 0, completed: 0 };
            }

            syllabusData.forEach(item => {
                if (!unitStats[item.unit]) {
                    unitStats[item.unit] = { total: 0, completed: 0 };
                }
                unitStats[item.unit].total++;
                if (completedItems.includes(item.id)) {
                    unitStats[item.unit].completed++;
                }
            });

            const unitContainer = document.getElementById('unit-progress-container');
            if (unitContainer) {
                unitContainer.innerHTML = '';
                Object.keys(unitStats).forEach(unitName => {
                    const stats = unitStats[unitName];
                    if (stats.total === 0) return; // Skip if no data for this unit
                    
                    const isComplete = stats.completed === stats.total;
                    const bgClass = isComplete ? 'bg-green-100 border-green-300 text-green-800 shadow-sm' : 'bg-white border-slate-200 text-slate-700';
                    const countClass = isComplete ? 'text-green-600' : 'text-slate-400';
                    const icon = isComplete ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-green-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>` : '';
                    
                    const unitHtml = `
                        <div class="flex items-center gap-2 border px-3 py-1.5 rounded-lg text-sm transition-colors duration-300 ${bgClass}">
                            <span class="font-semibold">${unitName}</span>
                            <span class="font-medium ${countClass} flex items-center gap-1">${stats.completed}/${stats.total} ${icon}</span>
                        </div>
                    `;
                    unitContainer.insertAdjacentHTML('beforeend', unitHtml);
                });
            }
            
            // Save state to local storage to persist reloads
            localStorage.setItem('syllabusTrackerState', JSON.stringify(completedItems));
        }

        function handleSquareClick(id) {
            currentItem = syllabusData.find(item => item.id === id);
            if (!currentItem) return;

            // Pick a random question for this statement out of the 5 options
            const randomIdx = Math.floor(Math.random() * currentItem.questions.length);
            currentQuestion = currentItem.questions[randomIdx];

            populateModal();
            openModal();
        }

        function populateModal() {
            modalUnitBadge.innerText = `${currentItem.unit}: ${currentItem.unitName}`;
            modalTitle.innerText = `${currentItem.id} - ${currentItem.statement}`;
            modalQuestion.innerText = currentQuestion.q;
            
            optionsContainer.innerHTML = '';
            modalFeedback.classList.add('hidden');
            modalFeedback.className = 'p-4 text-center font-bold text-sm hidden shrink-0';

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 transition-colors text-slate-700 font-medium";
                btn.innerHTML = `<span class="inline-block w-6 font-bold text-slate-400 mr-2">${String.fromCharCode(65 + index)}.</span> ${option}`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, btnElement) {
            // Disable all buttons to prevent multiple clicks
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300', 'cursor-pointer');
            });

            modalFeedback.classList.remove('hidden');

            if (selectedIndex === currentQuestion.answer) {
                // Correct Answer
                btnElement.classList.replace('bg-slate-50', 'bg-green-100');
                btnElement.classList.replace('border-slate-200', 'border-green-500');
                btnElement.classList.add('text-green-800');
                
                modalFeedback.innerText = "Correct! Great job.";
                modalFeedback.classList.add('bg-green-100', 'text-green-800');

                // Mark as completed
                if (incorrectItems.includes(currentItem.id)) {
                    incorrectItems = incorrectItems.filter(id => id !== currentItem.id);
                    localStorage.setItem('syllabusTrackerIncorrect', JSON.stringify(incorrectItems));
                }

                if (!completedItems.includes(currentItem.id)) {
                    completedItems.push(currentItem.id);
                    updateProgress();
                    
                    // Re-render grid to show green card immediately behind modal
                    renderGrid();
                }

                // Auto-close after a short delay
                setTimeout(() => {
                    closeModal();
                }, 1200);
            } else {
                // Incorrect Answer
                btnElement.classList.replace('bg-slate-50', 'bg-red-100');
                btnElement.classList.replace('border-slate-200', 'border-red-500');
                btnElement.classList.add('text-red-800');
                
                // Shake modal content
                modalContent.classList.remove('shake');
                void modalContent.offsetWidth; // trigger reflow
                modalContent.classList.add('shake');

                // Highlight correct answer slightly
                const correctBtn = allBtns[currentQuestion.answer];
                correctBtn.classList.replace('border-slate-200', 'border-green-400');
                correctBtn.classList.add('bg-green-50', 'opacity-80');

                modalFeedback.innerText = "Incorrect. Review this topic and try again later!";
                modalFeedback.classList.add('bg-red-100', 'text-red-800');

                // Mark as incorrect for the grid
                if (!completedItems.includes(currentItem.id) && !incorrectItems.includes(currentItem.id)) {
                    incorrectItems.push(currentItem.id);
                    localStorage.setItem('syllabusTrackerIncorrect', JSON.stringify(incorrectItems));
                    renderGrid(); // Re-render to show red square behind
                }

                // Give them time to read the right answer, then close or let them close manually
                setTimeout(() => {
                    // We'll let them close it manually so they can read the correct answer
                    allBtns.forEach(b => b.disabled = false); 
                }, 1000);
            }
        }

        function openModal() {
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before changing opacity for transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modalContent.classList.remove('shake');
            }, 300); // Matches transition duration
        }

        // Close modal when clicking outside of the content
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // Initialize on page load
        window.onload = initApp;

    </script>
</body>
</html>
